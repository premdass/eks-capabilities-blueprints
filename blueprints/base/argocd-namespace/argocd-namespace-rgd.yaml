# kro ResourceGraphDefinition for ArgoCD Namespace Onboarding
# Creates namespace + EKS AccessEntry granting ArgoCD write access
#
# Reads ArgoCD role ARN and cluster name from ConfigMap (created by Terraform)
# User only needs to specify the namespace name
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: argocd-namespace
spec:
  schema:
    apiVersion: v1alpha1
    kind: ArgoCDNamespace
    spec:
      namespace: string | required=true description="Namespace name for ArgoCD to deploy to"
    status:
      namespaceReady: ${appNamespace.metadata.name != ""}
      accessEntryReady: ${accessEntry.status.ackResourceMetadata.arn != ""}

  resources:
    # 1. Reference the ConfigMap to get ArgoCD role ARN and cluster name
    - id: config
      readyWhen:
        - ${config.data.argocdRoleArn != ""}
        - ${config.data.clusterName != ""}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: argocd-config
          namespace: argocd

    # 2. Create the namespace
    - id: appNamespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            argocd.argoproj.io/managed-namespace: "true"

    # 3. Create ACK AccessEntry with namespace-scoped EditPolicy
    - id: accessEntry
      template:
        apiVersion: eks.services.k8s.aws/v1alpha1
        kind: AccessEntry
        metadata:
          name: argocd-${schema.spec.namespace}
          namespace: argocd
        spec:
          clusterName: ${config.data.clusterName}
          principalARN: ${config.data.argocdRoleArn}
          type: STANDARD
          accessPolicies:
            - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy
              accessScope:
                type: namespace
                namespaces:
                  - ${schema.spec.namespace}
