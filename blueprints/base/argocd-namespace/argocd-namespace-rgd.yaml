# kro ResourceGraphDefinition for ArgoCD Namespace Onboarding
# Creates namespace + Kubernetes RBAC granting ArgoCD write access
#
# ArgoCD must be in the 'argocd-kro-access' Kubernetes group
# (configured via access entry kubernetesGroups)
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: argocd-namespace
spec:
  schema:
    apiVersion: v1alpha1
    kind: ArgoCDNamespace
    spec:
      namespace: string | required=true description="Namespace name for ArgoCD to deploy to"
    status:
      namespaceReady: ${appNamespace.metadata.name != ""}
      rbacReady: ${roleBinding.metadata.name != ""}

  resources:
    # 1. Create the namespace
    - id: appNamespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            argocd.argoproj.io/managed-namespace: "true"

    # 2. Create Role with edit permissions in the namespace
    - id: role
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: argocd-deploy
          namespace: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
        rules:
          # Core resources
          - apiGroups: [""]
            resources: ["configmaps", "endpoints", "persistentvolumeclaims", "pods", "secrets", "services", "serviceaccounts"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          # Apps
          - apiGroups: ["apps"]
            resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          # Batch
          - apiGroups: ["batch"]
            resources: ["jobs", "cronjobs"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          # Networking
          - apiGroups: ["networking.k8s.io"]
            resources: ["ingresses", "networkpolicies"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          # Autoscaling
          - apiGroups: ["autoscaling"]
            resources: ["horizontalpodautoscalers"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          # Policy
          - apiGroups: ["policy"]
            resources: ["poddisruptionbudgets"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

    # 3. Bind the Role to ArgoCD's Kubernetes group
    - id: roleBinding
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: argocd-deploy
          namespace: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: argocd-deploy
        subjects:
          - kind: Group
            name: argocd-kro-access
            apiGroup: rbac.authorization.k8s.io
